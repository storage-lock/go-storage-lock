name: Go package

on:
  pull_request:
  push:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-storage-lock

      # 兄弟仓库 go-events 未发布本仓库依赖的新 API，用本地 replace 指向平级目录
      - name: Checkout go-events
        uses: actions/checkout@v4
        with:
          repository: storage-lock/go-events
          path: go-events
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        working-directory: go-storage-lock
        run: go build ./...

      - name: Vet
        working-directory: go-storage-lock
        run: go vet ./...

      - name: Test
        working-directory: go-storage-lock
        run: go test -race ./...
